name: VURP-M validation

on:
  push:
    paths:
      - "packages/application/vurp_m/**"
      - ".github/workflows/vurp-m-syntax.yml"
  pull_request:
    paths:
      - "packages/application/vurp_m/**"
      - ".github/workflows/vurp-m-syntax.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile all VURP-M sources in syntax-only mode
        shell: bash
        run: |
          g++ \
            -std=c++20 \
            -Wall -Wextra -Wpedantic \
            -I packages/application/vurp_m/tests/gurobi_stub \
            -I packages/application/vurp_m/src \
            -fsyntax-only \
            packages/application/vurp_m/src/main.cpp \
            packages/application/vurp_m/src/vurpm.cpp

      - name: Build exact-pricing regression test
        shell: bash
        run: |
          g++ \
            -std=c++20 \
            -O2 \
            -Wall -Wextra -Wpedantic \
            -I packages/application/vurp_m/tests/gurobi_stub \
            -I packages/application/vurp_m/src \
            packages/application/vurp_m/tests/test_exact_pricing.cpp \
            packages/application/vurp_m/src/vurpm.cpp \
            packages/application/vurp_m/tests/gurobi_stub/gurobi_stub.cpp \
            -o /tmp/vurpm_exact_pricing_test

      - name: Run exact-pricing regression test
        shell: bash
        run: /tmp/vurpm_exact_pricing_test
